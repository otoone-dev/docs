<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コード進行＆アドリブ練習プレイヤー</title>
<style>
:root{
  --bg:#f4f1ea;--card:#fffdf8;--ink:#23211d;--muted:#7a756b;--line:#d9d3c5;
  --accent:#d9480f;--accent2:#2b6c8f;--avail:#4a6f8a;--chip:#ece7da;--chipOn:#23211d;--chipOnInk:#fffdf8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(40,30,10,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121316;--card:#1b1d22;--ink:#ece8df;--muted:#9a968c;--line:#34373e;
  --accent:#ff8a4c;--accent2:#6bb3d9;--avail:#8fb4cf;--chip:#262930;--chipOn:#ece8df;--chipOnInk:#16171a;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding:10px 10px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* ---- stage (staff) ---- */
.stage{padding:12px 14px 12px}
@media (min-height:700px){.stage{position:sticky;top:6px;z-index:5}}
.stage-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 22px}
.now{display:flex;align-items:baseline;gap:10px;min-width:0}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.chord{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;font-size:clamp(34px,8vw,58px);line-height:1.05;font-weight:700;letter-spacing:-.01em;min-width:2.2em}
.meta{display:grid;gap:1px;font-size:13px;color:var(--muted);flex:1 1 220px;min-width:0}
.meta b{color:var(--ink);font-weight:600}
.beats{display:flex;gap:7px;align-items:center;margin-left:auto;padding-bottom:6px}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--chip);border:1px solid var(--line);transition:background .06s,transform .06s}
.beats i.on{background:var(--ink);transform:scale(1.18)}
.beats i.on.first{background:var(--accent)}
#staffWrap{margin:6px -4px 0;overflow:hidden}
#staff{display:block;width:100%;height:auto;color:var(--ink)}
.readout{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);margin-top:2px}
.readout b{color:var(--accent);font-size:15px}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{flex:1 1 0;min-width:58px;text-align:center;padding:6px 6px;border-radius:9px;background:var(--chip);font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:15px;border:1px solid transparent;white-space:nowrap}
.chip.half{flex:.55 1 0;min-width:46px}
.chip.on{background:var(--chipOn);color:var(--chipOnInk)}

/* ---- controls ---- */
.controls{padding:14px 14px 16px;display:grid;gap:14px}
.controls h1{font-size:15px;margin:0;letter-spacing:.02em}
.controls h1 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:42px}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.chk{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.vol{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.vol input{width:110px;accent-color:var(--accent2)}
.play{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#btnPlay{font:inherit;font-size:17px;font-weight:700;padding:12px 34px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer;min-width:150px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#btnPlay:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
#btnPlay.stop{background:var(--ink);color:var(--card)}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">

<section class="stage card" aria-label="再生状況">
  <div class="stage-head">
    <div class="now"><span class="lbl">NOW</span><span id="chordName" class="chord">—</span></div>
    <div class="meta">
      <div>構成音　<b id="chordTones">—</b></div>
      <div>スケール　<b id="scaleName">—</b></div>
      <div>NEXT　<b id="nextName">—</b></div>
    </div>
    <div class="beats" id="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="staffWrap"><svg id="staff" role="img" aria-label="現在のコードとアドリブの五線譜"></svg></div>
  <div class="readout">
    <span>アドリブ音　<b id="adlibName">—</b></span>
    <span id="legend">黒＝コード　橙＝アドリブ　青の薄い音＝アベイラブルノート（濃い＝コードトーン）</span>
  </div>
  <div id="chips" class="chips"></div>
</section>

<section class="controls card">
  <h1>コード進行＆アドリブ練習プレイヤー<small>Space で再生／停止</small></h1>
  <div class="grid">
    <label class="f">コード進行
      <select id="selProg"></select>
    </label>
    <label class="f">調（長調 / 相対短調）
      <select id="selKey"></select>
    </label>
    <label class="f">テンポ
      <select id="selTempo"></select>
    </label>
    <label class="f">アドリブ（フルート）
      <select id="selPat"></select>
    </label>
  </div>
  <div class="row">
    <label class="vol">ピアノ <input type="range" id="volPiano" min="0" max="100" value="80"></label>
    <label class="vol">フルート <input type="range" id="volFlute" min="0" max="100" value="80"></label>
    <label class="chk"><input type="checkbox" id="chkClick">メトロノーム</label>
    <label class="chk"><input type="checkbox" id="chkCount" checked>カウントイン</label>
    <label class="chk"><input type="checkbox" id="chkAvail" checked>アベイラブルノート表示</label>
    <label class="chk"><input type="checkbox" id="chkNames" checked>音名表示</label>
  </div>
  <div class="play">
    <button id="btnPlay" type="button">▶ 再生</button>
    <span class="hint">コード進行・調を変えると頭から再開します。テンポ／アドリブ／音量は次のコードから反映されます。</span>
  </div>
</section>

</main>
<script>
'use strict';
/* ================= 音楽理論データ ================= */
const NAT=[0,2,4,5,7,9,11], LET='CDEFGAB', MAJ=[0,2,4,5,7,9,11];
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const accOff=a=>a==='#'?1:a==='b'?-1:0;
const pretty=(L,acc)=>LET[L]+(acc==='#'?'♯':acc==='b'?'♭':'');

/* 調（円環順） sig: +n=シャープ数 / -n=フラット数 */
const KEYS=[
 {id:'C', label:'C / Am',   pc:0, L:0,acc:'', sig:0},
 {id:'G', label:'G / Em',   pc:7, L:4,acc:'', sig:1},
 {id:'D', label:'D / Bm',   pc:2, L:1,acc:'', sig:2},
 {id:'A', label:'A / F♯m',  pc:9, L:5,acc:'', sig:3},
 {id:'E', label:'E / C♯m',  pc:4, L:2,acc:'', sig:4},
 {id:'B', label:'B / G♯m',  pc:11,L:6,acc:'', sig:5},
 {id:'F#',label:'F♯ / D♯m', pc:6, L:3,acc:'#',sig:6},
 {id:'Db',label:'D♭ / B♭m', pc:1, L:1,acc:'b',sig:-5},
 {id:'Ab',label:'A♭ / Fm',  pc:8, L:5,acc:'b',sig:-4},
 {id:'Eb',label:'E♭ / Cm',  pc:3, L:2,acc:'b',sig:-3},
 {id:'Bb',label:'B♭ / Gm',  pc:10,L:6,acc:'b',sig:-2},
 {id:'F', label:'F / Dm',   pc:5, L:3,acc:'', sig:-1},
];

/* pc と五線上の文字(L)から {L,acc} を決める。ダブル臨時記号になる場合は異名同音で回避 */
function spell(pc,L,key){
  const x=(((pc-NAT[L])%12)+12)%12, d=x>6?x-12:x;
  if(d===0)return{L,acc:''};
  if(d===1)return{L,acc:'#'};
  if(d===-1)return{L,acc:'b'};
  const nm=(key&&key.sig<0?FLAT:SHARP)[((pc%12)+12)%12];
  return{L:LET.indexOf(nm[0]),acc:nm.length>1?nm[1]:''};
}

/* コード種別: tones=[半音数, 文字オフセット]  sym=表記 */
const QUAL={
 '':      {sym:'',      tones:[[0,0],[4,2],[7,4]]},
 'm':     {sym:'m',     tones:[[0,0],[3,2],[7,4]]},
 '7':     {sym:'7',     tones:[[0,0],[4,2],[7,4],[10,6]]},
 'maj7':  {sym:'maj7',  tones:[[0,0],[4,2],[7,4],[11,6]]},
 'm7':    {sym:'m7',    tones:[[0,0],[3,2],[7,4],[10,6]]},
 'm7b5':  {sym:'m7♭5',  tones:[[0,0],[3,2],[6,4],[10,6]]},
 '9':     {sym:'9',     tones:[[0,0],[4,2],[7,4],[10,6],[14,1]]},
 'maj9':  {sym:'maj9',  tones:[[0,0],[4,2],[7,4],[11,6],[14,1]]},
 'm9':    {sym:'m9',    tones:[[0,0],[3,2],[7,4],[10,6],[14,1]]},
 '13':    {sym:'13',    tones:[[0,0],[4,2],[10,6],[14,1],[21,5]]},
 '7b9':   {sym:'7(♭9)', tones:[[0,0],[4,2],[7,4],[10,6],[13,1]]},
 'add9':  {sym:'add9',  tones:[[0,0],[4,2],[7,4],[14,1]]},
 'sus4':  {sym:'sus4',  tones:[[0,0],[5,3],[7,4]]},
 '7sus4': {sym:'7sus4', tones:[[0,0],[5,3],[7,4],[10,6]]},
};

/* スケール: notes=[半音数, 文字オフセット]  jp=日本語名 */
const SCALES={
 ionian:    {jp:'アイオニアン',            notes:[[0,0],[2,1],[4,2],[5,3],[7,4],[9,5],[11,6]]},
 dorian:    {jp:'ドリアン',                notes:[[0,0],[2,1],[3,2],[5,3],[7,4],[9,5],[10,6]]},
 phrygian:  {jp:'フリジアン',              notes:[[0,0],[1,1],[3,2],[5,3],[7,4],[8,5],[10,6]]},
 lydian:    {jp:'リディアン',              notes:[[0,0],[2,1],[4,2],[6,3],[7,4],[9,5],[11,6]]},
 mixolydian:{jp:'ミクソリディアン',        notes:[[0,0],[2,1],[4,2],[5,3],[7,4],[9,5],[10,6]]},
 aeolian:   {jp:'エオリアン（ナチュラルマイナー）',notes:[[0,0],[2,1],[3,2],[5,3],[7,4],[8,5],[10,6]]},
 locrian:   {jp:'ロクリアン',              notes:[[0,0],[1,1],[3,2],[5,3],[6,4],[8,5],[10,6]]},
 phrygdom:  {jp:'フリジアン・ドミナント',  notes:[[0,0],[1,1],[4,2],[5,3],[7,4],[8,5],[10,6]]},
 lyddom:    {jp:'リディアン・ドミナント',  notes:[[0,0],[2,1],[4,2],[6,3],[7,4],[9,5],[10,6]]},
 mixb13:    {jp:'ミクソリディアン♭13',     notes:[[0,0],[2,1],[4,2],[5,3],[7,4],[8,5],[10,6]]},
 blues:     {jp:'ブルーススケール',        notes:[[0,0],[3,2],[5,3],[6,4],[7,4],[10,6]]},
};

/* コード進行  ch=[度数(0-6), 変化(-1/0/1), 種別, スケール, 拍数(省略=4)] */
const D=(d,a,q,s,b)=>[d,a,q,s,b||4];
const PROGS=[
 {g:'シンプル（トライアド）',items:[
  {id:'i4v',name:'I–IV–V–I',ch:[D(0,0,'','ionian'),D(3,0,'','lydian'),D(4,0,'','mixolydian'),D(0,0,'','ionian')]},
  {id:'pop',name:'I–V–vi–IV（Let It Be 系）',ch:[D(0,0,'','ionian'),D(4,0,'','mixolydian'),D(5,0,'m','aeolian'),D(3,0,'','lydian')]},
  {id:'50s',name:'I–vi–IV–V（50sドゥーワップ）',ch:[D(0,0,'','ionian'),D(5,0,'m','aeolian'),D(3,0,'','lydian'),D(4,0,'','mixolydian')]},
  {id:'komuro',name:'vi–IV–V–I（小室進行）',ch:[D(5,0,'m','aeolian'),D(3,0,'','lydian'),D(4,0,'','mixolydian'),D(0,0,'','ionian')]},
  {id:'canon',name:'カノン進行（8小節）',ch:[D(0,0,'','ionian'),D(4,0,'','mixolydian'),D(5,0,'m','aeolian'),D(2,0,'m','phrygian'),D(3,0,'','lydian'),D(0,0,'','ionian'),D(3,0,'','lydian'),D(4,0,'','mixolydian')]},
  {id:'minor145',name:'マイナー i–iv–V7–i',ch:[D(5,0,'m','aeolian'),D(1,0,'m','dorian'),D(2,0,'7','phrygdom'),D(5,0,'m','aeolian')]},
  {id:'andalus',name:'アンダルシア進行 i–♭VII–♭VI–V7',ch:[D(5,0,'m','aeolian'),D(4,0,'','mixolydian'),D(3,0,'','lydian'),D(2,0,'7','phrygdom')]},
 ]},
 {g:'王道・J-POP（7th付き）',items:[
  {id:'oudou',name:'王道進行 IVmaj7–V7–iii7–vi7',ch:[D(3,0,'maj7','lydian'),D(4,0,'7','mixolydian'),D(2,0,'m7','phrygian'),D(5,0,'m7','aeolian')]},
  {id:'marusa',name:'丸サ進行 IVmaj7–III7–vi7–v7–I7',ch:[D(3,0,'maj7','lydian'),D(2,0,'7','phrygdom'),D(5,0,'m7','aeolian'),D(4,0,'m7','dorian',2),D(0,0,'7','mixolydian',2)]},
  {id:'popt',name:'I–V–vi–IV（add9・9th付き）',ch:[D(0,0,'add9','ionian'),D(4,0,'','mixolydian'),D(5,0,'m9','aeolian'),D(3,0,'maj9','lydian')]},
  {id:'sus',name:'IVmaj7–V7sus4–iii7–vi7（サス入り）',ch:[D(3,0,'maj7','lydian'),D(4,0,'7sus4','mixolydian'),D(2,0,'m7','phrygian'),D(5,0,'m7','aeolian')]},
 ]},
 {g:'ジャズ・テンション',items:[
  {id:'251',name:'ii–V–I（ループ）',ch:[D(1,0,'m7','dorian'),D(4,0,'7','mixolydian'),D(0,0,'maj7','ionian',8)]},
  {id:'1625',name:'I–vi–ii–V（循環）',ch:[D(0,0,'maj7','ionian'),D(5,0,'m7','aeolian'),D(1,0,'m7','dorian'),D(4,0,'7','mixolydian')]},
  {id:'3625',name:'iii–VI7–ii–V7（ドミナント連鎖）',ch:[D(2,0,'m7','phrygian'),D(5,0,'7','mixb13'),D(1,0,'m7','dorian'),D(4,0,'7','mixolydian')]},
  {id:'tens',name:'I–vi–ii–V（9th・13th テンション）',ch:[D(0,0,'maj9','ionian'),D(5,0,'m9','aeolian'),D(1,0,'m9','dorian'),D(4,0,'13','mixolydian')]},
  {id:'tritone',name:'裏コード ii–♭II7–I',ch:[D(1,0,'m9','dorian'),D(1,-1,'13','lyddom'),D(0,0,'maj9','ionian',8)]},
  {id:'leaves',name:'枯葉（8小節・マイナー終止）',ch:[D(1,0,'m7','dorian'),D(4,0,'7','mixolydian'),D(0,0,'maj7','ionian'),D(3,0,'maj7','lydian'),D(6,0,'m7b5','locrian'),D(2,0,'7b9','phrygdom'),D(5,0,'m7','aeolian',8)]},
 ]},
 {g:'ブルース',items:[
  {id:'blues12',name:'12小節ブルース（ブルーススケール）',ch:[D(0,0,'7','blues'),D(3,0,'7','blues'),D(0,0,'7','blues',8),D(3,0,'7','blues',8),D(0,0,'7','blues',8),D(4,0,'7','blues'),D(3,0,'7','blues'),D(0,0,'7','blues'),D(4,0,'7','blues')]},
 ]},
];
const PROG_BY_ID={};PROGS.forEach(g=>g.items.forEach(p=>PROG_BY_ID[p.id]=p));

/* アドリブパターン */
const PATTERNS=[
 ['none','アドリブなし'],
 ['whole','コード開始時に1音（ロングトーン）'],
 ['half','二分音符 ×2（スケール音）'],
 ['guide','ガイドトーン 3rd・7th（二分音符 ×2）'],
 ['quarter','四分音符 ×4（スケール音）'],
 ['chordtone','四分音符 ×4（コードトーン・アルペジオ）'],
 ['eighth','八分音符 ×8（順次進行）'],
 ['random','複雑なリズムをランダム'],
];
const TEMPOS=[];for(let t=40;t<=200;t+=10)TEMPOS.push(t);

/* ---- 音の生成ヘルパ ---- */
function realize(t,o){return{midi:12*(o+1)+NAT[t.L]+accOff(t.acc),step:o*7+t.L,L:t.L,acc:t.acc,pc:t.pc};}
function cands(t,lo,hi){const r=[];for(let o=0;o<=8;o++){const n=realize(t,o);if(n.midi>=lo&&n.midi<=hi)r.push(n);}return r;}
const noteLabel=n=>pretty(n.L,n.acc)+(Math.floor((n.midi-accOff(n.acc))/12)-1);

/* キーとコード定義からコードオブジェクトを構築 */
function buildChord(key,e){
  const [d,a,q,sc,beats]=e;
  const rootPc=(key.pc+MAJ[d]+a+120)%12, rootL=(key.L+d)%7;
  const rs=spell(rootPc,rootL,key), Q=QUAL[q], S=SCALES[sc];
  const mk=([semi,lo])=>{const pc=(rootPc+semi)%12;const s=spell(pc,(rootL+lo)%7,key);return{pc,L:s.L,acc:s.acc,semi};};
  const tones=Q.tones.map(mk), scale=S.notes.map(mk);
  const root={pc:rootPc,L:rs.L,acc:rs.acc};
  const tonePcs=new Set(tones.map(t=>t.pc));
  return{name:pretty(rs.L,rs.acc)+Q.sym,rootName:pretty(rs.L,rs.acc),root,tones,scale,tonePcs,
    scaleName:pretty(rs.L,rs.acc)+' '+S.jp,beats,qual:q};
}
function buildProgression(key,prog){return prog.ch.map(e=>buildChord(key,e));}

/* ボイシング: 右手(54-77)を前コードからの最小移動で選ぶ／左手ルート(36-47) */
function voiceChord(ch,prev){
  const tones=ch.tones.length>=5?ch.tones.slice(1):ch.tones;
  const lists=tones.map(t=>cands(t,54,77));
  let best=null,bc=1e9;
  const pm=prev?prev.rh.map(n=>n.midi).sort((a,b)=>a-b):null;
  (function rec(i,cur){
    if(i===lists.length){
      const m=cur.map(n=>n.midi).sort((a,b)=>a-b);
      const span=m[m.length-1]-m[0], cen=m.reduce((s,x)=>s+x,0)/m.length;
      let c=(span>14?(span-14)*8:0)+Math.abs(cen-65)*0.5;
      if(pm){const n=Math.min(m.length,pm.length);for(let k=0;k<n;k++)c+=Math.abs(m[k]-pm[k]);c+=Math.abs(m.length-pm.length)*3;}
      if(c<bc){bc=c;best=cur.slice();}
      return;
    }
    for(const n of lists[i])rec(i+1,cur.concat([n]));
  })(0,[]);
  best.sort((a,b)=>a.midi-b.midi);
  const bass=cands(ch.root,36,47)[0];
  return{rh:best,bass};
}

/* アベイラブルノート（アドリブ音域 E4–C6） */
const AD_LO=64, AD_HI=84;
function availNotes(ch){
  const out=[];
  ch.scale.forEach(t=>cands(t,AD_LO,AD_HI).forEach(n=>{n.chordTone=ch.tonePcs.has(n.pc);n.tone=t;out.push(n);}));
  out.sort((a,b)=>a.midi-b.midi);
  return out;
}

/* ================= 五線譜描画 (SVG) ================= */
const Y0=222, yOf=s=>Y0-(s-12)*5;           // step 12 (C1相当) を基準に、1step=5px
const staffOf=s=>s>=28?'t':'b';             // C4以上は高音部、未満は低音部
const SIG_STEPS={
  '#':{t:[38,35,39,36,33,37,34],b:[24,21,25,22,19,23,20]},
  'b':{t:[34,37,33,36,32,35,31],b:[20,23,19,22,18,21,17]},
};
function sigMapFor(key){
  const m={},n=Math.abs(key.sig),order=key.sig>0?[3,0,4,1,5,2,6]:[6,2,5,1,4,0,3];
  for(let i=0;i<n;i++)m[order[i]]=key.sig>0?'#':'b';
  return m;
}
const SVG_STYLE='<style>.ink{fill:currentColor}.inkS{stroke:currentColor;fill:none}.ad{fill:var(--accent)}.adS{stroke:var(--accent);fill:none}'
 +'.av{fill:var(--avail)}.avS{stroke:var(--avail);fill:none}.mut{fill:currentColor;opacity:.5}'
 +'text{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif}.acc{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","Noto Music",Georgia,serif}</style>';

const ln=(x1,y1,x2,y2,cls,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls||'inkS'}" stroke-width="${w||1.4}"/>`;
const accGlyph=a=>a==='#'?'♯':a==='b'?'♭':'♮';

function ledgers(step,cx,cls){
  const [b,t]=staffOf(step)==='t'?[30,38]:[18,26];let s='';
  if(step>t)for(let l=t+2;l<=step;l+=2)s+=ln(cx-10,yOf(l),cx+10,yOf(l),cls||'inkS',1.4);
  if(step<b)for(let l=b-2;l>=step;l-=2)s+=ln(cx-10,yOf(l),cx+10,yOf(l),cls||'inkS',1.4);
  return s;
}
function accText(x,step,acc,cls,size){
  const y=yOf(step)+(acc==='b'?3.5:acc==='#'?0.5:0.5);
  return `<text x="${x}" y="${y}" class="acc ${cls||'ink'}" font-size="${size||24}" text-anchor="middle" dominant-baseline="central">${accGlyph(acc)}</text>`;
}
function head(cx,step,kind,cls){
  const cy=yOf(step);
  if(kind==='open')return `<ellipse cx="${cx}" cy="${cy}" rx="6.6" ry="4.7" transform="rotate(-20 ${cx} ${cy})" class="${cls||'inkS'}" stroke-width="2.3"/>`;
  return `<ellipse cx="${cx}" cy="${cy}" rx="6.2" ry="4.5" transform="rotate(-20 ${cx} ${cy})" class="${cls||'ink'}"/>`;
}
const TREBLE_CLEF='M-3.4 20 C-3.4 25 4.4 25 4 17 L0.6 -30 C0.2 -38 5.6 -44 6.4 -36 C7 -28 -1 -22 -6.2 -12 C-10.4 -4 -9.2 6 -1 8.2 C6.4 9.8 9.6 0 5.6 -5 C2.4 -8.6 -3.2 -6.4 -3 -1';
const BASS_CLEF='M-8 -3 C-1 -9.5 10.5 -6.5 9.6 3 C8.8 11 1.5 18 -9 24';

/* st = {key, chord, voicing, avail, adlib, rest}, opt = {showAvail, showNames} */
function renderStaff(st,opt){
  const svg=document.getElementById('staff');
  const wrapW=document.getElementById('staffWrap').clientWidth||800;
  const W=Math.max(520,Math.min(1000,Math.round(wrapW))), H=262;
  svg.setAttribute("viewBox",`0 34 ${W} ${H-34}`);
  const key=st.key, sigMap=sigMapFor(key), nSig=Math.abs(key.sig);
  const L0=14, R0=W-12;
  let h=SVG_STYLE;

  /* 五線・左端ライン・ブレース・終止線 */
  for(let s=18;s<=26;s+=2)h+=ln(L0,yOf(s),R0,yOf(s),'inkS',1.3);
  for(let s=30;s<=38;s+=2)h+=ln(L0,yOf(s),R0,yOf(s),'inkS',1.3);
  h+=ln(L0,yOf(38),L0,yOf(18),'inkS',1.8);
  const yt=yOf(38),yb=yOf(18),ym=(yt+yb)/2;
  h+=`<path d="M${L0-2} ${yt} C${L0-14} ${yt+22} ${L0-14} ${ym-10} ${L0-7} ${ym} C${L0-14} ${ym+10} ${L0-14} ${yb-22} ${L0-2} ${yb}" class="inkS" stroke-width="2"/>`;
  h+=ln(R0-5,yOf(38),R0-5,yOf(30),'inkS',1.3)+ln(R0-5,yOf(26),R0-5,yOf(18),'inkS',1.3)
   +ln(R0,yOf(38),R0,yOf(30),'inkS',3.2)+ln(R0,yOf(26),R0,yOf(18),'inkS',3.2);

  /* 音部記号 */
  h+=`<g transform="translate(36 ${yOf(32)})"><path d="${TREBLE_CLEF}" class="inkS" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3.4" cy="20.6" r="2.4" class="ink"/></g>`;
  h+=`<g transform="translate(32 ${yOf(24)})"><circle cx="-4.2" cy="-1.4" r="3.9" class="ink"/><path d="${BASS_CLEF}" class="inkS" stroke-width="2.7" stroke-linecap="round"/><circle cx="14.5" cy="-5" r="1.9" class="ink"/><circle cx="14.5" cy="5" r="1.9" class="ink"/></g>`;

  /* 調号 */
  const keyX0=60;
  if(nSig){
    const a=key.sig>0?'#':'b';
    for(let i=0;i<nSig;i++){
      const x=keyX0+i*9.5;
      h+=accText(x,SIG_STEPS[a].t[i],a,'ink',23)+accText(x,SIG_STEPS[a].b[i],a,'ink',23);
    }
  }
  const keyW=nSig?nSig*9.5+8:0;
  const xChord=Math.max(118,keyX0+keyW+44), xAd=xChord+64, availX=xAd+62;

  /* 見出し */
  const sc=st.chord?st.chord.scaleName:'';
  h+=`<text x="${xChord}" y="52" class="mut" font-size="11" text-anchor="middle">コード</text>`
    +`<text x="${xAd}" y="52" class="mut" font-size="11" text-anchor="middle">アドリブ</text>`;
  if(opt.showAvail)h+=`<text x="${availX}" y="52" class="mut" font-size="11">アベイラブルノート　${sc}</text>`;

  /* コードの音符 */
  if(st.voicing){
    const notes=[st.voicing.bass,...st.voicing.rh].sort((a,b)=>a.step-b.step);
    let prev=-99,pd=false;
    notes.forEach(n=>{n.disp=(n.step-prev===1&&!pd);pd=n.disp;prev=n.step;});
    const colEnd=[];
    notes.slice().reverse().forEach(n=>{
      const need=n.acc!==(sigMap[n.L]||'');
      if(!need)return;
      let c=0;while(colEnd[c]!==undefined&&Math.abs(colEnd[c]-n.step)<6)c++;
      colEnd[c]=n.step;n.accCol=c;
    });
    notes.forEach(n=>{
      const cx=xChord+(n.disp?12:0);
      h+=ledgers(n.step,cx,'inkS')+head(cx,n.step,'open','inkS');
      if(n.accCol!==undefined)h+=accText(xChord-13-n.accCol*10,n.step,n.acc,'ink',22);
    });
  }

  /* アベイラブルノート（薄く） */
  let curIdx=-1;
  if(opt.showAvail&&st.avail&&st.avail.length){
    let list=st.avail, off=0;
    const zone=R0-12-availX, maxN=Math.max(4,Math.floor(zone/15));
    if(list.length>maxN){
      const ci=st.adlib?list.findIndex(n=>n.midi===st.adlib.midi):-1;
      off=ci>=maxN?Math.min(ci-Math.floor(maxN/2),list.length-maxN):0;
      list=list.slice(off,off+maxN);
    }
    const sp=Math.min(40,zone/list.length);
    list.forEach((n,i)=>{
      const cx=availX+(i+0.5)*sp, cur=st.adlib&&n.midi===st.adlib.midi;
      const cls=n.chordTone?'av':'av';
      const op=n.chordTone?0.62:0.26;
      h+=`<g opacity="${cur?1:op}">`+ledgers(n.step,cx,'avS')+head(cx,n.step,'fill',cls);
      if(n.acc!==(sigMap[n.L]||''))h+=accText(cx-11,n.step,n.acc,'av',19);
      h+='</g>';
      if(cur)h+=`<circle cx="${cx}" cy="${yOf(n.step)}" r="10.5" class="adS" stroke-width="2"/>`;
      if(opt.showNames)h+=`<text x="${cx}" y="${H-10}" font-size="12" text-anchor="middle" class="${n.chordTone?'av':'mut'}" font-weight="${n.chordTone?700:400}" opacity="${n.chordTone?0.85:1}">${pretty(n.L,n.acc)}</text>`;
    });
  }

  /* アドリブの音符 */
  if(st.adlib){
    const n=st.adlib, cx=xAd;
    h+=ledgers(n.step,cx,'adS')+head(cx,n.step,'fill','ad');
    const up=n.step<34;
    h+=up?ln(cx+5.7,yOf(n.step)-1,cx+5.7,yOf(n.step)-31,'adS',1.9):ln(cx-5.7,yOf(n.step)+1,cx-5.7,yOf(n.step)+31,'adS',1.9);
    if(n.acc!==(sigMap[n.L]||''))h+=accText(cx-14,n.step,n.acc,'ad',22);
  }else if(st.rest){
    h+=`<text x="${xAd}" y="${yOf(34)+4}" font-size="13" text-anchor="middle" class="mut">休符</text>`;
  }
  svg.innerHTML=h;
}

/* ================= 音声エンジン (Web Audio) ================= */
const A={ctx:null,master:null,conv:null,noise:null,sess:null};
function initAudio(){
  if(A.ctx)return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=0.005;comp.release.value=0.2;
  const master=ctx.createGain();master.gain.value=0.9;
  master.connect(comp);comp.connect(ctx.destination);
  const len=Math.floor(ctx.sampleRate*2.2),ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const conv=ctx.createConvolver();conv.buffer=ir;
  const wet=ctx.createGain();wet.gain.value=0.28;conv.connect(wet);wet.connect(master);
  const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  Object.assign(A,{ctx,master,conv,noise:nb});
}
function newSession(){
  const ctx=A.ctx,pb=ctx.createGain(),fb=ctx.createGain(),cb=ctx.createGain();
  pb.connect(A.master);pb.connect(A.conv);
  fb.connect(A.master);fb.connect(A.conv);
  cb.connect(A.master);cb.gain.value=0.3;
  A.sess={pb,fb,cb};applyVolumes();
}
function applyVolumes(){
  if(!A.sess)return;
  const v=id=>Math.pow(+document.getElementById(id).value/100,1.5);
  A.sess.pb.gain.value=v('volPiano');A.sess.fb.gain.value=v('volFlute');
}
function endSession(){
  const s=A.sess;if(!s)return;A.sess=null;
  const now=A.ctx.currentTime;
  [s.pb,s.fb,s.cb].forEach(g=>{g.gain.cancelScheduledValues(now);g.gain.setTargetAtTime(0,now,0.03);});
  setTimeout(()=>[s.pb,s.fb,s.cb].forEach(g=>{try{g.disconnect();}catch(e){}}),600);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);

/* サスティンペダル付きピアノ（加算合成＋ハンマーノイズ） */
function pianoNote(t,midi,vel,dur){
  const ctx=A.ctx,f=mtof(midi),end=t+dur;
  const out=ctx.createGain(),lp=ctx.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=Math.min(14000,900+vel*5200+f*2);lp.Q.value=0.3;
  out.connect(lp);lp.connect(A.sess.pb);
  out.gain.setValueAtTime(1,t);
  out.gain.setTargetAtTime(0.6,t+0.02,0.3);
  out.gain.setTargetAtTime(0,end,0.14);
  const peak=0.17*vel*(midi<48?1.15:1);
  const np=midi<60?8:midi<76?6:4;
  const tau0=Math.max(1.0,Math.min(7,5.2*Math.pow(261.6/f,0.45)));
  for(let n=1;n<=np;n++){
    const fr=f*n*Math.sqrt(1+0.00018*n*n);if(fr>12000)break;
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=fr;
    const g=ctx.createGain();
    const a=peak*Math.pow(n,-1.15)*(n===2?1.3:1)*(1+(vel-0.5)*0.6*(n>2?1:0));
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+0.003);
    g.gain.setTargetAtTime(0,t+0.003,tau0/(1+0.7*(n-1)));
    o.connect(g);g.connect(out);o.start(t);o.stop(end+1.3);
  }
  const nz=ctx.createBufferSource();nz.buffer=A.noise;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=Math.min(f*3,5000);bp.Q.value=0.9;
  const ng=ctx.createGain();
  ng.gain.setValueAtTime(vel*0.06,t);ng.gain.setTargetAtTime(0,t,0.012);
  nz.connect(bp);bp.connect(ng);ng.connect(out);nz.start(t,Math.random()*0.5);nz.stop(t+0.15);
}

/* フルート（正弦波＋倍音＋ブレスノイズ＋ビブラート） */
function fluteNote(t,midi,dur,vel){
  const ctx=A.ctx,f=mtof(midi),end=t+dur,peak=0.22*vel;
  const g=ctx.createGain();g.connect(A.sess.fb);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+0.07);
  const rel=Math.max(end-0.08,t+0.08);
  g.gain.setValueAtTime(peak,rel);
  g.gain.linearRampToValueAtTime(0,end+0.05);
  const lfo=ctx.createOscillator();lfo.frequency.value=5.2;
  const lg=ctx.createGain();lg.gain.setValueAtTime(0,t);
  lg.gain.setValueAtTime(0,t+0.25);lg.gain.linearRampToValueAtTime(f*0.0045,t+0.7);
  lfo.connect(lg);lfo.start(t);lfo.stop(end+0.2);
  [[1,1],[2,0.28],[3,0.1],[4,0.04]].forEach(([n,a])=>{
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*n;
    lg.connect(o.frequency);
    const og=ctx.createGain();og.gain.value=a;
    o.connect(og);og.connect(g);o.start(t);o.stop(end+0.2);
  });
  const nz=ctx.createBufferSource();nz.buffer=A.noise;nz.loop=true;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=Math.min(f*2,6000);bp.Q.value=0.8;
  const ng=ctx.createGain();
  ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(0.3,t+0.02);
  ng.gain.linearRampToValueAtTime(0.08,t+0.15);
  ng.gain.setValueAtTime(0.08,rel);ng.gain.linearRampToValueAtTime(0,end+0.05);
  nz.connect(bp);bp.connect(ng);ng.connect(g);nz.start(t);nz.stop(end+0.2);
}

function clickSound(t,accent){
  const ctx=A.ctx,o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=accent?1500:1000;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(accent?0.9:0.6,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g);g.connect(A.sess.cb);o.start(t);o.stop(t+0.07);
}

/* ================= アドリブ生成 ================= */
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],chance=p=>Math.random()<p;
const clampI=(i,n)=>Math.max(0,Math.min(n-1,i));
function nearestIdx(arr,midi){let b=0,bd=1e9;arr.forEach((n,i)=>{const d=Math.abs(n.midi-midi);if(d<bd){bd=d;b=i;}});return b;}
function ctNear(arr,j,r){
  for(let o=0;o<=r;o++){
    if(arr[j+o]&&arr[j+o].chordTone)return j+o;
    if(arr[j-o]&&arr[j-o].chordTone)return j-o;
  }
  return j;
}
function walkNext(av,i,ct,leap){
  const steps=leap?[-5,-4,-3,3,4,5]:[-2,-1,-1,1,1,2,0];
  let j=clampI(i+pick(steps),av.length);
  if(ct)j=ctNear(av,j,2);
  return j;
}
function pingpong(arr,i0,count){
  const out=[];let i=i0,d=chance(0.5)?1:-1;
  for(let k=0;k<count;k++){
    out.push(arr[i]);
    if(chance(0.2))d=-d;
    let ni=i+d;if(ni<0||ni>=arr.length){d=-d;ni=i+d;}
    i=clampI(ni,arr.length);
  }
  return out;
}
function chordToneNotes(ch){
  const r=[];ch.tones.forEach(t=>cands(t,AD_LO,AD_HI).forEach(n=>{n.chordTone=true;r.push(n);}));
  return r.sort((a,b)=>a.midi-b.midi);
}
/* 戻り値: [{beat,dur,note|null}] （beat/dur は拍単位） */
function genAdlib(ch,next,pat,prev,beats){
  const av=availNotes(ch),ev=[];
  if(!av.length||pat==='none')return ev;
  const base=prev?nearestIdx(av,prev.midi):nearestIdx(av,74);
  const s0=ctNear(av,clampI(base+pick([-2,-1,0,1,2]),av.length),3);
  if(pat==='whole'){
    ev.push({beat:0,dur:beats,note:av[s0]});
  }else if(pat==='half'){
    let i=s0;
    for(let k=0;k<Math.round(beats/2);k++){ev.push({beat:k*2,dur:2,note:av[i]});i=walkNext(av,i,chance(0.5),chance(0.2));}
  }else if(pat==='guide'){
    const gt=[ch.tones[1],ch.tones[ch.tones.length>3?3:2]];
    let ref=prev?prev.midi:74;
    for(let k=0;k<Math.round(beats/2);k++){
      const c=cands(gt[k%2],AD_LO,AD_HI);
      let best=c[0];c.forEach(n=>{if(Math.abs(n.midi-ref)<Math.abs(best.midi-ref))best=n;});
      ev.push({beat:k*2,dur:2,note:best});ref=best.midi;
    }
  }else if(pat==='quarter'){
    let i=s0;
    for(let k=0;k<beats;k++){
      ev.push({beat:k,dur:1,note:av[i]});
      let j=walkNext(av,i,chance(0.45),chance(0.12));
      if(j===i)j=clampI(i+(chance(0.5)?1:-1),av.length);
      i=j;
    }
  }else if(pat==='chordtone'){
    const arr=chordToneNotes(ch);
    const i0=clampI(nearestIdx(arr,prev?prev.midi:72)+pick([-1,0,1]),arr.length);
    pingpong(arr,i0,beats).forEach((n,k)=>ev.push({beat:k,dur:1,note:n}));
  }else if(pat==='eighth'){
    pingpong(av,s0,beats*2).forEach((n,k)=>ev.push({beat:k*0.5,dur:0.5,note:n}));
  }else if(pat==='random'){
    const durs=[0.5,0.5,0.5,1,1,1.5,2];
    let pos=0,i=s0;
    while(pos<beats-1e-6){
      const rem=beats-pos,ok=durs.filter(d=>d<=rem+1e-6),d=pick(ok.length?ok:[rem]);
      if(pos>0&&chance(0.14)){ev.push({beat:pos,dur:d,note:null});}
      else{
        const strong=Math.abs(pos-Math.round(pos))<1e-6&&Math.round(pos)%2===0;
        if(pos>0)i=walkNext(av,i,strong&&chance(0.6),chance(0.2));
        ev.push({beat:pos,dur:d,note:av[i]});
      }
      pos+=d;
    }
    /* 最後の音は次のコードへ半音・全音で寄せる */
    const last=ev[ev.length-1];
    if(next&&last&&last.note&&chance(0.55)){
      const targets=[];next.tones.forEach(t=>cands(t,AD_LO,AD_HI).forEach(n=>targets.push(n.midi)));
      const opt=av.filter(n=>targets.some(m=>Math.abs(m-n.midi)===1||Math.abs(m-n.midi)===2)&&Math.abs(n.midi-last.note.midi)<=5);
      if(opt.length)last.note=pick(opt);
    }
  }
  return ev;
}

/* ================= スケジューラ & UI ================= */
const $=id=>document.getElementById(id);
const P={playing:false,timer:0,raf:0,idx:0,nextT:0,events:[],chords:[],voicings:[],avails:[],key:KEYS[0],prevAd:null};
const ST={key:KEYS[0],chord:null,voicing:null,avail:null,adlib:null,rest:false};
let dirty=false;

function opts(){return{showAvail:$('chkAvail').checked,showNames:$('chkNames').checked};}
function drawStaff(){dirty=false;renderStaff(ST,opts());}

function rebuild(){
  P.key=KEYS.find(k=>k.id===$('selKey').value)||KEYS[0];
  const prog=PROG_BY_ID[$('selProg').value];
  P.chords=buildProgression(P.key,prog);
  P.voicings=[];P.chords.forEach((c,i)=>P.voicings.push(voiceChord(c,P.voicings[i-1]||null)));

}
function setChordUI(i,live){
  const ch=P.chords[i],nx=P.chords[(i+1)%P.chords.length];
  ST.key=P.key;ST.chord=ch;ST.voicing=P.voicings[i];ST.avail=P.avails[i];
  ST.adlib=null;ST.rest=live&&$('selPat').value!=='none';
  $('chordName').textContent=ch.name;

  $('adlibName').textContent='—';
  P.chords.forEach((c,k)=>$('chip'+k).classList.toggle('on',live&&k===i));
  dirty=true;
}
function setAdlibUI(n){
  ST.adlib=n;ST.rest=!n&&$('selPat').value!=='none';
  $('adlibName').textContent=n?noteLabel(n):'休符';
  dirty=true;
}
function setBeatUI(b){
  [...$('beats').children].forEach((el,i)=>el.classList.toggle('on',i===b));
}
function showPreview(){
  ST.key=P.key;setChordUI(0,false);setBeatUI(-1);drawStaff();
}

function scheduleChord(){
  const ctx=A.ctx,spb=60/(+$('selTempo').value);
  const i=P.idx,ch=P.chords[i],vo=P.voicings[i],nx=P.chords[(i+1)%P.chords.length];
  const t=P.nextT,pat=$('selPat').value,click=$('chkClick').checked;
  const dur=ch.beats*spb;
  /* ピアノ：ペダルを踏んだまま次のコードの直前で離す */
  const hold=dur-0.04;
  pianoNote(t,vo.bass.midi,0.8,hold);
  vo.rh.forEach((n,k)=>pianoNote(t+0.012*(k+1)+Math.random()*0.006,n.midi,0.5+Math.random()*0.12,hold-0.012*(k+1)));
  const evs=[{t,fn:()=>setChordUI(i,true)}];
  for(let b=0;b<ch.beats;b++){
    if(click)clickSound(t+b*spb,b===0);
    evs.push({t:t+b*spb,fn:()=>setBeatUI(b%4)});
  }
  /* フルート */
  const ad=genAdlib(ch,nx,pat,P.prevAd,ch.beats);
  ad.forEach(e=>{
    const at=t+e.beat*spb;
    if(e.note){
      fluteNote(at,e.note.midi,Math.max(0.12,e.dur*spb-0.04),0.8+Math.random()*0.15);
      P.prevAd=e.note;
    }
    evs.push({t:at,fn:()=>setAdlibUI(e.note)});
  });
  evs.sort((a,b)=>a.t-b.t);
  P.events.push(...evs);
  P.nextT=t+dur;P.idx=(i+1)%P.chords.length;
}
function tick(){
  while(P.playing&&P.nextT<A.ctx.currentTime+0.25)scheduleChord();
}
function frame(){
  if(!P.playing)return;
  const now=A.ctx.currentTime;
  while(P.events.length&&P.events[0].t<=now)P.events.shift().fn();
  if(dirty)drawStaff();
  P.raf=requestAnimationFrame(frame);
}
function startPlay(){
  initAudio();A.ctx.resume();
  rebuild();newSession();
  P.playing=true;P.events=[];
  const spb=60/(+$('selTempo').value);
  let t=A.ctx.currentTime+0.15;
  if($('chkCount').checked){
    for(let b=0;b<4;b++){
      clickSound(t+b*spb,b===0);
      P.events.push({t:t+b*spb,fn:()=>{setBeatUI(b);$('chordName').textContent=String(b+1);}});
    }
    P.events.push({t:t,fn:()=>{ST.key=P.key;ST.chord=P.chords[0];ST.voicing=P.voicings[0];ST.avail=P.avails[0];ST.adlib=null;ST.rest=false;dirty=true;}});
    t+=4*spb;
  }
  P.nextT=t;
  $('btnPlay').textContent='■ 停止';$('btnPlay').classList.add('stop');
  tick();P.timer=setInterval(tick,25);
  P.raf=requestAnimationFrame(frame);
}
function stopPlay(){
  P.playing=false;clearInterval(P.timer);cancelAnimationFrame(P.raf);P.events=[];
  endSession();
  $('btnPlay').textContent='▶ 再生';$('btnPlay').classList.remove('stop');
  rebuild();showPreview();
}
function togglePlay(){P.playing?stopPlay():startPlay();}
function restartIfPlaying(){
  if(P.playing){stopPlay();startPlay();}else{rebuild();showPreview();}
}

/* ---- 初期化 ---- */
function init(){
  const sp=$('selProg');
  PROGS.forEach(g=>{
    const og=document.createElement('optgroup');og.label=g.g;
    g.items.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;og.appendChild(o);});
    sp.appendChild(og);
  });
  sp.value='oudou';
  KEYS.forEach(k=>{const o=document.createElement('option');o.value=k.id;o.textContent=k.label;$('selKey').appendChild(o);});
  TEMPOS.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent='♩ = '+t;$('selTempo').appendChild(o);});
  $('selTempo').value='80';
  PATTERNS.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;$('selPat').appendChild(o);});
  $('selPat').value='half';
  $('beats').firstElementChild.classList.add('first');

  $('btnPlay').addEventListener('click',togglePlay);
  $('selProg').addEventListener('change',restartIfPlaying);
  $('selKey').addEventListener('change',restartIfPlaying);
  $('selPat').addEventListener('change',()=>{ST.rest=false;});
  ['volPiano','volFlute'].forEach(id=>$(id).addEventListener('input',applyVolumes));
  ['chkAvail','chkNames'].forEach(id=>$(id).addEventListener('change',drawStaff));
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'&&!/^(SELECT|INPUT|BUTTON|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();togglePlay();}
  });
  let rz=0;
  window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawStaff,80);});
  rebuild();showPreview();
}
init();
</script>
